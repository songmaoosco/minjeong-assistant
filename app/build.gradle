apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.minjeong.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.minjeong.assistant"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(project.findProperty('VERSION_CODE') ?: "1")
        versionName project.findProperty('VERSION_NAME') ?: "1.0"
        buildConfigField "String", "GROQ_API_KEY", "\"${project.findProperty('GROQ_API_KEY') ?: ""}\""
        buildConfigField "String", "HF_API_KEY", "\"${project.findProperty('HF_API_KEY') ?: ""}\""
        buildConfigField "String", "OPENROUTER_API_KEY", "\"${project.findProperty('OPENROUTER_API_KEY') ?: ""}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-datasource:1.4.1"

    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'

    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
}